<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In • DocuSuite</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        background: #e6f0ff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-container {
        background: white;
        
        border-radius: 12px;
        display: flex;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        max-width: 800px;
        width: 100%;
      }
      .visual-section {
        flex: 1;
        background: #f5f7ff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
      }
      .visual-section img {
        width: 80%;
        max-width: 300px;
      }
      .form-section {
        flex: 1;
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .form-header h1 {
        font-size: 28px;
        font-weight: 600;
        color: #333;
        margin-bottom: 5px;
      }
      .form-header p {
        font-size: 14px;
        color: #777;
        margin-bottom: 25px;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        font-size: 14px;
        color: #333;
        margin-bottom: 5px;
        font-weight: 500;
      }
      .form-group label::before {
        content: '* ';
        color: #ff5a5a;
      }
      .form-group input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
      }
      .form-group input:focus {
        border-color: #4a90e2;
      }
      .password-container {
        position: relative;
      }
      .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: none;
        font-size: 14px;
        cursor: pointer;
      }
      .btn-primary {
        width: 100%;
        padding: 10px;
        background: #2979ff;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        margin-top: 10px;
      }
      .btn-primary:hover {
        background: #1c63d6;
      }
      .btn-secondary {
        width: 100%;
        padding: 10px;
        background: white;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        margin-top: 8px;
      }
      .btn-secondary:hover {
        background: #f8f8f8;
      }
      .tabs {
        display: none; /* hidden to match the uploaded design */
      }
      .result {
        margin-top: 10px;
        font-size: 13px;
        text-align: center;
        padding: 8px;
        border-radius: 6px;
        display: none;
      }
      .result.success {
        background: #d4edda;
        color: #155724;
      }
      .result.error {
        background: #f8d7da;
        color: #721c24;
      }
      @media (max-width: 768px) {
        .login-container {
          flex-direction: column;
        }
        .visual-section {
          padding: 20px;
        }
        .form-section {
          padding: 30px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Simplified Navbar for Login Page -->
    <header
      class="navbar"
      style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: 'Poppins', sans-serif;
      "
    >
      <div
        class="brand"
        style="
          display: flex;
          align-items: center;
          gap: 10px;
          font-weight: 700;
          font-size: 20px;
          color: #333;
        "
      >
        <img
          src="/images/logo.png"
          alt="Logo"
          style="height: 28px; width: 28px; object-fit: contain"
        />
        <span>DocuSuite</span>
      </div>
      <nav class="nav-links" style="display: flex; gap: 20px">
        <a
          href="/index.html#hero"
          style="
            color: #333;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
          "
          onmouseover="this.style.background='rgba(110, 184, 225, 0.1)'"
          onmouseout="this.style.background='transparent'"
          >Home</a
        >
        <a
          href="/index.html#summarizeSection"
          style="
            color: #333;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
          "
          onmouseover="this.style.background='rgba(110, 184, 225, 0.1)'"
          onmouseout="this.style.background='transparent'"
          >Summarization</a
        >
        <a
          href="/docgen.html"
          style="
            color: #333;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
          "
          onmouseover="this.style.background='rgba(110, 184, 225, 0.1)'"
          onmouseout="this.style.background='transparent'"
          >Document Generation</a
        >
        <a
          href="/index.html#legal"
          style="
            color: #333;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
          "
          onmouseover="this.style.background='rgba(110, 184, 225, 0.1)'"
          onmouseout="this.style.background='transparent'"
          >Legal Advise</a
        >
      </nav>
    </header>

    <div class="login-container" style="margin-top: 80px">
      <!-- Left image section -->
      <div class="visual-section">
        <img src="./images/l1.png" alt="Character" />
      </div>

      <!-- Form Section -->
      <div class="form-section">
        <!-- Sign In Form -->
        <div id="loginForm" class="form-content active">
          <div class="form-header">
            <h1>Sign In</h1>
            <p>Unlock your world.</p>
          </div>
          <form id="loginFormElement">
            <div class="form-group">
              <label for="loginUsername">Username</label>
              <input
                type="text"
                id="loginUsername"
                name="username"
                placeholder="Enter your username"
                required
              />
            </div>
            <div class="form-group">
              <label for="loginEmail">Email</label>
              <input
                type="email"
                id="loginEmail"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>
            <div class="form-group">
              <label for="loginPassword">Password</label>
              <div class="password-container">
                <input
                  type="password"
                  id="loginPassword"
                  name="password"
                  placeholder="Enter your password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  onclick="togglePassword('loginPassword')"
                >
                  👁️
                </button>
              </div>
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
            <button
              type="button"
              class="btn-secondary"
              onclick="showTab('register')"
            >
              Create an account
            </button>
            <div id="loginResult" class="result"></div>
          </form>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="form-content" style="display: none">
          <div class="form-header">
            <h1>Create Account</h1>
            <p>Join our community.</p>
          </div>
          <form id="registerFormElement">
            <div class="form-group">
              <label for="registerUsername">Username</label>
              <input
                type="text"
                id="registerUsername"
                name="username"
                placeholder="Choose a username"
                required
              />
            </div>
            <div class="form-group">
              <label for="registerEmail">Email</label>
              <input
                type="email"
                id="registerEmail"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>
            <div class="form-group">
              <label for="registerPassword">Password</label>
              <div class="password-container">
                <input
                  type="password"
                  id="registerPassword"
                  name="password"
                  placeholder="Create a password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  onclick="togglePassword('registerPassword')"
                >
                  👁️
                </button>
              </div>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <div class="password-container">
                <input
                  type="password"
                  id="confirmPassword"
                  name="password2"
                  placeholder="Repeat password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  onclick="togglePassword('confirmPassword')"
                >
                  👁️
                </button>
              </div>
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
            <div id="registerResult" class="result"></div>
          </form>
        </div>
      </div>
    </div>

    <script>
      function showTab(tabName) {
        document.getElementById('loginForm').style.display =
          tabName === 'login' ? 'block' : 'none';
        document.getElementById('registerForm').style.display =
          tabName === 'register' ? 'block' : 'none';
      }
      function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const button = input.nextElementSibling;
        if (input.type === 'password') {
          input.type = 'text';
          button.textContent = '🙈';
        } else {
          input.type = 'password';
          button.textContent = '👁️';
        }
      }
      document
        .getElementById('loginFormElement')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          const resultDiv = document.getElementById('loginResult');
          resultDiv.style.display = 'block';
          resultDiv.textContent = 'Signing in...';
          resultDiv.className = 'result';
          const formData = new FormData(e.target);
          const username = formData.get('username');
          const email = formData.get('email');
          const password = formData.get('password');
          try {
            const response = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, email, password }),
            });
            const data = await response.json();
            if (response.ok) {
              resultDiv.textContent = 'Success! Redirecting...';
              resultDiv.className = 'result success';
              localStorage.setItem('currentUser', username);
              localStorage.setItem('userEmail', email);
              setTimeout(() => {
                window.location.href = '/';
              }, 1000);
            } else {
              resultDiv.textContent = data.error || 'Login failed';
              resultDiv.className = 'result error';
            }
          } catch {
            resultDiv.textContent = 'Network error. Please try again.';
            resultDiv.className = 'result error';
          }
        });
      document
        .getElementById('registerFormElement')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          const resultDiv = document.getElementById('registerResult');
          resultDiv.style.display = 'block';
          resultDiv.textContent = 'Creating account...';
          resultDiv.className = 'result';
          const formData = new FormData(e.target);
          const username = formData.get('username');
          const email = formData.get('email');
          const password = formData.get('password');
          const password2 = formData.get('password2');
          if (password !== password2) {
            resultDiv.textContent = 'Passwords do not match';
            resultDiv.className = 'result error';
            return;
          }
          try {
            const response = await fetch('/api/auth/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, email, password }),
            });
            const data = await response.json();
            if (response.ok) {
              resultDiv.textContent = 'Account created! Redirecting...';
              resultDiv.className = 'result success';
              localStorage.setItem('currentUser', username);
              localStorage.setItem('userEmail', email);
              setTimeout(() => {
                window.location.href = '/';
              }, 1000);
            } else {
              resultDiv.textContent = data.error || 'Registration failed';
              resultDiv.className = 'result error';
            }
          } catch {
            resultDiv.textContent = 'Network error. Please try again.';
            resultDiv.className = 'result error';
          }
        });
    </script>
  </body>
  <script src="/chatbot.js"></script>
</html>
