<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Government Dashboard • DocuSuite</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .government-dashboard {
        min-height: 100vh;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        padding: 20px;
      }
      .dashboard-header {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-left h1 {
        color: #e2e8f0;
        margin: 0 0 6px;
        font-size: 24px;
      }
      .header-left p {
        color: #94a3b8;
        margin: 0;
      }
      .government-info {
        text-align: right;
      }
      .government-info .username {
        color: #e2e8f0;
        font-weight: 700;
      }
      .logout-btn {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 700;
      }
      .documents-container {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 20px;
      }
      .documents-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .documents-header h2 {
        color: #e2e8f0;
        margin: 0;
        font-size: 18px;
      }
      .refresh-btn {
        background: linear-gradient(
          135deg,
          var(--accent, #6eb8e1),
          var(--accent2, #c8abe6)
        );
        color: #0b1120;
        border: none;
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        font-weight: 700;
      }
      .documents-list {
        display: grid;
        gap: 14px;
      }
      .document-item {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 16px;
      }
      .document-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 10px;
      }
      .document-info h3 {
        color: #e2e8f0;
        margin: 0 0 6px;
        font-size: 16px;
      }
      .document-info .user-email {
        color: #93c5fd;
        font-size: 13px;
      }
      .document-status {
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
      }
      .status-pending {
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }
      .status-verified {
        background: rgba(34, 197, 94, 0.2);
        color: #22c55e;
        border: 1px solid rgba(34, 197, 94, 0.35);
      }
      .document-details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 8px;
        margin-top: 8px;
      }
      .label {
        color: #94a3b8;
        font-size: 12px;
      }
      .value {
        color: #e2e8f0;
        font-size: 13px;
      }
      .document-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 10px;
      }
      .verify-btn {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #0b1120;
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 800;
      }
      .reject-btn {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 800;
      }
      .no-documents {
        text-align: center;
        color: #94a3b8;
        padding: 40px 20px;
      }
    </style>
  </head>
  <body>
    <div class="government-dashboard">
      <div class="dashboard-header">
        <div class="header-left">
          <h1>🏛️ Government Dashboard</h1>
          <p>Review and verify user submissions</p>
        </div>
        <div class="government-info">
          <div class="username" id="governmentUsername">Official</div>
          <button class="logout-btn" id="govLogout">Logout</button>
        </div>
      </div>

      <div class="documents-container">
        <div class="documents-header">
          <h2>Pending Documents</h2>
          <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
        </div>
        <div id="documentsList" class="documents-list"></div>
      </div>
    </div>

    <script>
      function checkAuth() {
        const isLoggedIn = localStorage.getItem('governmentLoggedIn');
        if (!isLoggedIn) {
          window.location.href = '/government-login.html';
          return false;
        }
        const username =
          localStorage.getItem('governmentUsername') || 'Official';
        document.getElementById('governmentUsername').textContent = username;
        return true;
      }

      async function loadDocuments() {
        const list = document.getElementById('documentsList');
        list.innerHTML = '<div class="no-documents">Loading documents...</div>';
        try {
          const res = await fetch('/api/government/documents');
          const data = await res.json();
          const docs =
            data && data.ok && Array.isArray(data.documents)
              ? data.documents
              : [];
          if (docs.length === 0) {
            list.innerHTML =
              '<div class="no-documents">No submissions found.</div>';
            return;
          }
          list.innerHTML = docs.map(renderDoc).join('');
          bindRowButtons();
        } catch (_) {
          list.innerHTML =
            '<div class="no-documents">Error loading documents.</div>';
        }
      }

      function renderDoc(doc) {
        const statusClass =
          doc.status === 'verified' ? 'status-verified' : 'status-pending';
        return `
          <div class="document-item" data-id="${doc.id}">
            <div class="document-header">
              <div class="document-info">
                <h3>${doc.documentType}</h3>
                <div class="user-email">${doc.userEmail}</div>
              </div>
              <div class="document-status ${statusClass}">${doc.status.toUpperCase()}</div>
            </div>
            <div class="document-details">
              <div><div class="label">Submitted</div><div class="value">${new Date(
                doc.submittedAt
              ).toLocaleString()}</div></div>
              <div><div class="label">Company</div><div class="value">${
                (doc.payload && doc.payload.companyName) || '—'
              }</div></div>
              <div><div class="label">Owner</div><div class="value">${
                (doc.payload && doc.payload.businessOwner) || '—'
              }</div></div>
            </div>
            <div class="document-actions">
              ${
                doc.status === 'pending'
                  ? `<button class="verify-btn" data-action="verify">✅ Verify</button>
              <button class="reject-btn" data-action="reject">❌ Reject</button>`
                  : ''
              }
            </div>
          </div>
        `;
      }

      function bindRowButtons() {
        document.querySelectorAll('.document-item .verify-btn').forEach((b) => {
          b.addEventListener('click', async (e) => {
            const row = e.target.closest('.document-item');
            const id = row.getAttribute('data-id');
            try {
              const res = await fetch(
                `/api/government/documents/${id}/verify`,
                { method: 'POST' }
              );
              await res.json();
              loadDocuments();
            } catch (_) {}
          });
        });
        document.querySelectorAll('.document-item .reject-btn').forEach((b) => {
          b.addEventListener('click', async (e) => {
            const row = e.target.closest('.document-item');
            const id = row.getAttribute('data-id');
            const reason = prompt('Enter rejection reason:') || '';
            try {
              const res = await fetch(
                `/api/government/documents/${id}/reject`,
                {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ reason }),
                }
              );
              await res.json();
              loadDocuments();
            } catch (_) {}
          });
        });
      }

      document.getElementById('govLogout').addEventListener('click', () => {
        localStorage.removeItem('governmentLoggedIn');
        localStorage.removeItem('governmentUsername');
        window.location.href = '/government-login.html';
      });

      document
        .getElementById('refreshBtn')
        .addEventListener('click', loadDocuments);

      document.addEventListener('DOMContentLoaded', () => {
        if (checkAuth()) loadDocuments();
      });
    </script>
  </body>
</html>
