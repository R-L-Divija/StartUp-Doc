<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat with Lawyer - IDM Services</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .user-chat-container {
        min-height: 100vh;
        background: linear-gradient(135deg, #0e1426 0%, #1e293b 100%);
        padding: 20px;
        display: flex;
        flex-direction: column;
      }

      .chat-header {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .chat-header h1 {
        color: #22c55e;
        margin: 0;
        font-size: 2rem;
      }

      .back-btn {
        background: linear-gradient(135deg, #64748b, #475569);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }

      .back-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(100, 116, 139, 0.3);
      }

      .chat-container {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 200px);
      }

      .chat-info {
        background: rgba(34, 197, 94, 0.1);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 20px;
        border-radius: 20px 20px 0 0;
      }

      .chat-info h3 {
        color: #22c55e;
        margin: 0 0 10px 0;
        font-size: 1.3rem;
      }

      .chat-info p {
        color: #94a3b8;
        margin: 5px 0;
        font-size: 0.9rem;
      }

      .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 15px;
        word-wrap: break-word;
      }

      .message.user {
        background: rgba(59, 130, 246, 0.2);
        color: #e6ecff;
        align-self: flex-end;
        border-bottom-right-radius: 5px;
      }

      .message.lawyer {
        background: rgba(34, 197, 94, 0.2);
        color: #e6ecff;
        align-self: flex-start;
        border-bottom-left-radius: 5px;
      }

      .message-time {
        font-size: 0.8rem;
        color: #64748b;
        margin-top: 5px;
      }

      .chat-input-container {
        padding: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        gap: 10px;
      }

      .chat-input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.3);
        color: #e6ecff;
        outline: none;
        transition: border-color 0.3s ease;
      }

      .chat-input:focus {
        border-color: #22c55e;
      }

      .send-btn {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #0b1120;
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .send-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
      }

      .send-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .no-chat {
        text-align: center;
        color: #94a3b8;
        padding: 50px 20px;
        font-size: 1.1rem;
      }

      .loading {
        text-align: center;
        color: #22c55e;
        padding: 50px 20px;
        font-size: 1.1rem;
      }

      .error-message {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 10px;
        padding: 15px;
        text-align: center;
        margin: 20px;
      }

      @media (max-width: 768px) {
        .chat-header {
          flex-direction: column;
          gap: 20px;
          text-align: center;
        }

        .chat-container {
          max-height: calc(100vh - 250px);
        }

        .message {
          max-width: 90%;
        }
      }
    </style>
  </head>
  <body>
    <div class="user-chat-container">
      <div class="chat-header">
        <div>
          <h1>💬 Chat with Lawyer</h1>
          <p style="color: #94a3b8; margin: 5px 0 0 0">
            Discuss your legal consultation
          </p>
        </div>
        <a href="/index.html" class="back-btn">← Back to Home</a>
      </div>

      <div class="chat-container">
        <div class="chat-info" id="chatInfo">
          <h3>Loading consultation...</h3>
          <p>Please wait while we load your chat.</p>
        </div>

        <div class="chat-messages" id="chatMessages">
          <div class="loading">Loading messages...</div>
        </div>

        <div class="chat-input-container">
          <input
            type="text"
            class="chat-input"
            id="chatInput"
            placeholder="Type your message..."
            maxlength="500"
            disabled
          />
          <button class="send-btn" id="sendBtn" disabled>Send</button>
        </div>
      </div>
    </div>

    <script>
      let currentConsultationId = null;
      let currentConsultation = null;

      // Get consultation ID from URL parameter
      function getConsultationId() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('id');
      }

      // Load consultation details
      async function loadConsultation() {
        const consultationId = getConsultationId();
        if (!consultationId) {
          showError('No consultation ID provided');
          return;
        }

        currentConsultationId = consultationId;

        try {
          const response = await fetch(
            `/api/user/consultation/${consultationId}`
          );
          const data = await response.json();

          if (data.ok) {
            currentConsultation = data.consultation;
            updateChatInfo();
            loadChatMessages();
            enableChat();
          } else {
            showError(data.error || 'Failed to load consultation');
          }
        } catch (error) {
          showError('Error loading consultation: ' + error.message);
        }
      }

      // Update chat info header
      function updateChatInfo() {
        const chatInfo = document.getElementById('chatInfo');
        chatInfo.innerHTML = `
                <h3>Chat with ${
                  currentConsultation.lawyerName || 'Legal Advisor'
                }</h3>
                <p><strong>Category:</strong> ${currentConsultation.category.toUpperCase()}</p>
                <p><strong>Status:</strong> ${
                  currentConsultation.status === 'accepted'
                    ? '✅ Accepted'
                    : '⏳ Pending'
                }</p>
            `;
      }

      // Load chat messages
      async function loadChatMessages() {
        try {
          const response = await fetch(
            `/api/user/chat/${currentConsultationId}/messages`
          );
          const data = await response.json();

          if (data.ok) {
            displayMessages(data.messages);
            // Mark messages as read when user opens chat
            markMessagesAsRead();
          } else {
            showError(data.error || 'Failed to load messages');
          }
        } catch (error) {
          showError('Error loading messages: ' + error.message);
        }
      }

      // Mark messages as read
      async function markMessagesAsRead() {
        try {
          await fetch(`/api/user/chat/${currentConsultationId}/mark-read`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              userEmail: currentConsultation.email,
            }),
          });

          // Update navbar badge if on main page
          if (window.opener) {
            window.opener.postMessage({ type: 'messagesRead' }, '*');
          }
        } catch (error) {
          console.error('Error marking messages as read:', error);
        }
      }

      // Display messages
      function displayMessages(messages) {
        const chatMessages = document.getElementById('chatMessages');

        if (messages.length === 0) {
          chatMessages.innerHTML = `
                    <div class="no-chat">
                        <div style="font-size: 3rem; margin-bottom: 20px;">💬</div>
                        No messages yet. Start the conversation!
                    </div>
                `;
          return;
        }

        const messagesHTML = messages
          .map((message) => {
            const messageClass = message.sender === 'user' ? 'user' : 'lawyer';
            const time = new Date(message.timestamp).toLocaleTimeString(
              'en-IN',
              {
                hour: '2-digit',
                minute: '2-digit',
              }
            );

            return `
                    <div class="message ${messageClass}">
                        <div>${message.text}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;
          })
          .join('');

        chatMessages.innerHTML = messagesHTML;
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // Enable chat functionality
      function enableChat() {
        if (currentConsultation.status === 'accepted') {
          document.getElementById('chatInput').disabled = false;
          document.getElementById('sendBtn').disabled = false;
          document.getElementById('chatInput').placeholder =
            'Type your message...';
        } else {
          document.getElementById('chatInput').placeholder =
            'Chat will be enabled once lawyer accepts your request';
        }
      }

      // Send message
      async function sendMessage() {
        const messageInput = document.getElementById('chatInput');
        const message = messageInput.value.trim();

        if (!message || !currentConsultationId) return;

        try {
          const response = await fetch(
            `/api/user/chat/${currentConsultationId}/send`,
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                message: message,
                userEmail: currentConsultation.email,
              }),
            }
          );

          const data = await response.json();

          if (data.ok) {
            // Add message to chat
            const chatMessages = document.getElementById('chatMessages');
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', 'user');
            messageElement.innerHTML = `
                        <div>${message}</div>
                        <div class="message-time">${new Date().toLocaleTimeString(
                          'en-IN',
                          { hour: '2-digit', minute: '2-digit' }
                        )}</div>
                    `;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Clear input
            messageInput.value = '';
          } else {
            alert('Failed to send message: ' + (data.error || 'Unknown error'));
          }
        } catch (error) {
          alert('Error sending message: ' + error.message);
        }
      }

      // Show error message
      function showError(message) {
        const chatMessages = document.getElementById('chatMessages');
        chatMessages.innerHTML = `
                <div class="error-message">
                    ${message}
                </div>
            `;
      }

      // Initialize chat
      document.addEventListener('DOMContentLoaded', () => {
        loadConsultation();

        // Event listeners
        document
          .getElementById('chatInput')
          .addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
              sendMessage();
            }
          });

        document
          .getElementById('sendBtn')
          .addEventListener('click', sendMessage);
      });
    </script>
  </body>
  <script src="/chatbot.js"></script>
</html>
